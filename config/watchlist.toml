# Stock Eagle – seurantalista.
# Lisää tai poista osakkeita vapaasti. Kentät:
#   ticker  = sovelluksen sisäinen tunnus (Helsingin pörssin kaupankäyntitunnus)
#   name    = näyttönimi
#   sector  = toimiala (lähteen antama toimiala korvaa tämän, jos sellainen saadaan)
#   ids     = lähdekohtaiset tunnisteet. Jos puuttuu, lähde johtaa tunnisteen tickeristä
#             Inderes vaatii yrityssivun osoitteen lopun (slug).
#             Finnhub: Finnhubin ilmainen taso estää Helsingin .HE-tunnukset, mutta yhtiön
#             USA-tunnus (ADR/OTC, esim. NOK) palauttaa saman yhtiön analyytikkokonsensuksen.
#             Helsingin osakkeelle ilman finnhub-tunnusta Finnhubia ei kutsuta.
# Uusi lähde voi käyttää omaa avaintaan ids-taulukossa ilman koodimuutoksia muualle.

